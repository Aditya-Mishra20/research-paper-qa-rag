[project]
name = "research-paper-qa"
version = "0.1.0"
description = "Python-based RAG system for Research Paper QA with FastAPI, Streamlit, MCP Server, and Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.28.0",
    "streamlit==1.63.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=1.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "pymupdf==1.28.2",
    "pymupdf4llm>=0.0.27",
    "httpx>=0.27.0",
    "mcp>=0.1.0",
    "google-genai>=2.22.0",
    "python-multipart>=0.0.32",
    "chromadb==1.5.9",
    "arxiv==4.0.1",
    "sentence-transformers>=6.0",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
