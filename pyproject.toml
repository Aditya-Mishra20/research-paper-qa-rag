[project]
name = "research-paper-qa"
version = "0.1.0"
description = "Python-based RAG system for Research Paper QA with FastAPI, Streamlit, MCP Server, and Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "openai>=1.12.0",
    "sentence-transformers>=2.5.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.0.0",
    "tiktoken>=0.6.0",
    "httpx>=0.27.0",
    "mcp>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]
